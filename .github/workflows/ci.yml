name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Builds every tier, including the Godot projects: Godot.NET.Sdk comes from NuGet,
      # so no Godot editor is needed to compile.
      - name: Build
        run: dotnet build EternalWars.sln --configuration Release

      - name: Test
        run: dotnet test --solution EternalWars.sln --configuration Release --no-build
